[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG API service"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34,<2",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "flower>=2,<3",
    "pydantic>=2.7,<3",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.17.1",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# 只检查语法错误和未定义名称。导入分行和编码声明沿用项目现有写法。
select = ["E9", "F"]
