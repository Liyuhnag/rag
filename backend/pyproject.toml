    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]
